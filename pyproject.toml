[project]
name = "rs-dic-llm"
version = "0.1.0"
description = "Dictionary-graph cycle metrics for LLM concept understanding evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.6.1",
    "nltk>=3.9",
    "pulp>=2.9",
    "requests>=2.32",
    "tqdm>=4.67",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scipy>=1.14",
    "highspy>=1.14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rs_dic_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
